name: Kurse holen
on:
  schedule:
    # Mo–Fr stündlich von 7 bis 22 Uhr Berlin (Winterzeit; UTC 6–21). GitHub lässt geplante Läufe oft ausfallen
    # oder startet sie spät; stündliche Versuche sorgen dafür, dass vor jedem Lauf der Automatik (:33) frische Kurse da sind.
    # Minute 17 statt :00, weil zur vollen Stunde besonders viele Läufe ausfallen.
    - cron: "17 6-21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daten
  cancel-in-progress: false
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch.py
      - name: Ergebnis speichern
        run: |
          git config user.name "aktien-bot"
          git config user.email "aktien-bot@users.noreply.github.com"
          git add data/aktien.json
          git diff --cached --quiet && exit 0
          git commit -m "Kurse $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
