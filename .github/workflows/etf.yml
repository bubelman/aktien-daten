name: ETF-Daten
# Holt Kurse und Fondsdaten aller ETFs aus etfs.txt und schreibt data/etfs.json (Levin, 15.11.2026).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [etfs.txt, etf.py]
  schedule:
    - cron: "23 16 * * 1-5"
permissions:
  contents: write
jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python etf.py
      - name: Speichern
        run: |
          git config user.name "aktien-bot"
          git config user.email "aktien-bot@users.noreply.github.com"
          cp data/etfs.json "$RUNNER_TEMP/etfs.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/etfs.json" data/etfs.json
            git add data/etfs.json
            git diff --cached --quiet && exit 0
            git commit -q -m "ETF-Daten $(date -u +%F' '%H:%M)"
            git push -q && exit 0
            sleep 15
          done
          echo "Speichern fehlgeschlagen"; exit 1
