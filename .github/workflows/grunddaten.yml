name: Grunddaten holen (voll)
on:
  # Zeitplan übernimmt jetzt kurse-schleife.yml; hier nur noch manuell (und Grunddaten bei Änderungen an tickers.txt/fetch.py)
  workflow_dispatch:
    inputs:
      voll:
        description: "Grunddaten für alle Aktien neu holen, auch wenn heute schon geholt (z. B. nach neuen Feldern in fetch.py)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [tickers.txt, fetch.py]
permissions:
  contents: write
concurrency:
  group: daten
  cancel-in-progress: false
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch.py ${{ inputs.voll && '--voll' || '--voll-wenn-alt' }}
      - name: Ergebnis speichern
        run: |
          git config user.name "aktien-bot"
          git config user.email "aktien-bot@users.noreply.github.com"
          # Immer die ganze neue Datei auf den neuesten Stand von main legen (laufen zwei Abrufe gleichzeitig,
          # gab es sonst Konflikte in aktien.json und die neuen Daten gingen verloren – 14.11.2026)
          cp data/aktien.json "$RUNNER_TEMP/aktien.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/aktien.json" data/aktien.json
            git add data/aktien.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Daten (Morgenlauf) $(date -u +%F' '%H:%M)"
            git push -q && exit 0
            sleep 15
          done
          echo "Speichern fehlgeschlagen"; exit 1
