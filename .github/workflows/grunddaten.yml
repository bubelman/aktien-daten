name: Grunddaten holen (voll)
on:
  schedule:
    # Mo–Fr früh am Morgen (UTC). GitHub lässt geplante Läufe oft ausfallen oder startet sie Stunden zu spät,
    # darum mehrere Versuche; der erste, der durchkommt, holt die Grunddaten, die übrigen nur Kurse.
    - cron: "41 1,2,3,4,5 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [tickers.txt, fetch.py]
permissions:
  contents: write
concurrency:
  group: daten
  cancel-in-progress: false
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch.py --voll-wenn-alt
      - name: Ergebnis speichern
        run: |
          git config user.name "aktien-bot"
          git config user.email "aktien-bot@users.noreply.github.com"
          git add data/aktien.json
          git diff --cached --quiet && exit 0
          git commit -m "Daten (Morgenlauf) $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
