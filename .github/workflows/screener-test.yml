name: Screener Probelauf
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python screener.py --trocken
      - name: Speichern
        run: |
          git config user.name "aktien-bot"
          git config user.email "aktien-bot@users.noreply.github.com"
          cp data/screener.json "$RUNNER_TEMP/s.json"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/s.json" data/screener.json
            git add data/screener.json; git diff --cached --quiet && exit 0
            git commit -q -m "Screener Probelauf"; git push -q && exit 0; sleep 10
          done
